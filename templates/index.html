<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Data Input Form</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input[type="number"],
        select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fff;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .prediction-output {
            text-align: center;
            color: var(--primary-color);
            margin-top: 1.5rem;
            border-top: 2px dashed var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Customer Profile Form</h2>
    <form action="#" method="POST">
        
        <!-- Credit Score -->
        <div class="form-group">
            <label desert for="credit_score">Credit Score</label>
            <input type="number" id="credit_score" name="credit_score" min="300" max="850" placeholder="e.g., 650" required>
        </div>

        <!-- Country -->
        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>Select country</option>
                <option value="France">France</option>
                <option value="Germany">Germany</option>
                <option value="Spain">Spain</option>
            </select>
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Age -->
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="18" max="120" placeholder="e.g., 35" required>
        </div>

        <!-- Tenure -->
        <div class="form-group">
            <label for="tenure">Tenure (Years)</label>
            <input type="number" id="tenure" name="tenure" min="0" max="100" placeholder="e.g., 5" required>
        </div>

        <!-- Balance -->
        <div class="form-group">
            <label for="balance">Account Balance</label>
            <input type="number" id="balance" name="balance" step="0.01" min="0" placeholder="e.g., 50000.00" required>
        </div>

        <!-- Number of Products -->
        <div class="form-group">
            <label for="products_number">Number of Products</label>
            <input type="number" id="products_number" name="products_number" min="1" max="10" placeholder="e.g., 2" required>
        </div>

        <!-- Estimated Salary -->
        <div class="form-group">
            <label for="estimated_salary">Estimated Salary</label>
            <input type="number" id="estimated_salary" name="estimated_salary" step="0.01" min="0" placeholder="e.g., 85000.00" required>
        </div>

        <!-- Has Credit Card (Explicit 0/1 Selection) -->
        <div class="form-group">
            <label for="credit_card">Has Credit Card?</label>
            <select id="credit_card" name="credit_card" required>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
            </select>
        </div>

        <!-- Is Active Member (Explicit 0/1 Selection) -->
        <div class="form-group">
            <label for="active_member">Is Active Member?</label>
            <select id="active_member" name="active_member" required>
                <option value="1">Yes (1)</option>
                <option value="0">No (0)</option>
            </select>
        </div>

        <button type="submit">Submit Data</button>
    </form>

    <!-- Prediction Output Block -->
 
    <div class="prediction-output">
        <h1>Prediction Result: {{prediction}}</h1>
    </div>
   
</div>

</body>
</html>
